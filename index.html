<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progetti di data visualization</title>
<style>
:root{--fg:#1c1c1c;--muted:#5f6368;--bg:#ffffff;--panel:#f6f6f4;--line:#dcdcd8;--accent:#2a6fdb}
@media (prefers-color-scheme: dark){:root{--fg:#ececec;--muted:#a3a3a3;--bg:#161616;--panel:#1f1f1f;--line:#343434;--accent:#6ea2f5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5}
main{max-width:56rem;margin:0 auto;padding:2.5rem 1rem}
h1{font-size:clamp(1.75rem,4vw,2.5rem);letter-spacing:-0.015em;margin:0 0 .25rem}
.sub{color:var(--muted);margin:0 0 2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:12px;list-style:none;margin:0;padding:0}
.card{display:block;height:100%;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:inherit;text-decoration:none}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card h2{font-size:1.125rem;margin:0 0 .25rem}
.card p{margin:0;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>Progetti di data visualization</h1>
  <p class="sub">Dashboard e visualizzazioni interattive.</p>
  <ul class="grid">
    <!-- Per aggiungere un progetto: crea una cartella con il suo index.html e copia questo blocco <li>. -->
    <li><a class="card" href="province/">
      <h2>Imprese nelle province italiane</h2>
      <p>Mappa, KPI e classifica per provincia, 2021–2025, con filtri per anno, settore, dimensione e macroarea.</p>
    </a></li>
  </ul>
</main>
</body>
</html>
